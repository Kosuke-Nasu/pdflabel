<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDFラベルメーカー</title>
  <style>
    /* 全体: 余計な装飾をせず、読みやすさだけを整える */
    body {
      max-width: 480px;
      margin: 0 auto;
      padding: 24px 16px;
      font-family: system-ui, sans-serif;
      font-size: 15px;
      line-height: 1.5;
      color: #222;
    }

    h1 {
      font-size: 22px;
      margin: 0 0 20px;
    }

    /* 入力項目のまとまり */
    fieldset {
      border: 1px solid #ccc;
      border-radius: 4px;
      margin: 0 0 16px;
      padding: 12px 16px;
    }

    legend {
      padding: 0 4px;
      font-weight: bold;
    }

    /* ラベル名と入力欄を2列ずつ並べる */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 16px;
    }

    /* 項目名が長い欄は1行に1項目ずつ並べる */
    .rows label + label {
      margin-top: 8px;
    }

    label {
      display: block;
    }

    input[type="number"] {
      width: 6em;
      padding: 4px;
      font-size: 15px;
    }

    select,
    input[type="search"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px;
      font-size: 15px;
    }

    input[type="search"] {
      margin-bottom: 8px;
    }

    /* 補足の小さな文字 */
    .note {
      margin: 4px 0 0;
      font-size: 13px;
      color: #666;
    }

    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      font-size: 15px;
      font-family: inherit;
    }

    button {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
    }

    /* ボタンの下に出すお知らせ（読み込み中・エラー・警告） */
    #status {
      min-height: 1.5em;
      margin: 8px 0 0;
      /* 複数のエラーを改行して表示する */
      white-space: pre-line;
    }

    #status.error {
      color: #c00;
    }

    #status.warning {
      color: #a60;
    }
  </style>
  <!-- jsPDF（JavaScript で PDF を作成するライブラリ）。バージョンは固定 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/4.2.1/jspdf.umd.min.js"></script>
</head>
<body>
  <h1>PDFラベルメーカー</h1>

  <!-- 用紙プリセット（あらかじめ登録した用紙の寸法）。選ぶと寸法の欄に値が入る -->
  <fieldset>
    <legend>用紙プリセット</legend>
    <!-- 入力した文字を含むプリセットだけを選択肢に残す -->
    <input type="search" id="presetFilter" placeholder="絞り込み（例: エーワン 12面）">
    <!-- 選択肢は JavaScript で PRESETS から作る -->
    <select id="preset"></select>
    <p id="presetCount" class="note"></p>
  </fieldset>

  <!-- 印字するテキスト（改行はそのまま反映する） -->
  <fieldset>
    <legend>テキスト</legend>
    <textarea id="text" rows="4" placeholder="ラベルに印字する内容を入力"></textarea>
  </fieldset>

  <!-- 用紙の余白（単位: mm） -->
  <fieldset>
    <legend>用紙の余白（mm）</legend>
    <div class="grid">
      <label>上 <input type="number" id="marginTop" value="10" min="0" step="0.01"></label>
      <label>下 <input type="number" id="marginBottom" value="10" min="0" step="0.01"></label>
      <label>左 <input type="number" id="marginLeft" value="10" min="0" step="0.01"></label>
      <label>右 <input type="number" id="marginRight" value="10" min="0" step="0.01"></label>
    </div>
  </fieldset>

  <!-- ラベル1枚の大きさ（単位: mm） -->
  <fieldset>
    <legend>ラベルのサイズ（mm）</legend>
    <div class="grid">
      <label>幅 <input type="number" id="labelWidth" value="60" min="0" step="0.01"></label>
      <label>高さ <input type="number" id="labelHeight" value="30" min="0" step="0.01"></label>
    </div>
  </fieldset>

  <!-- ラベル同士の間隔（単位: mm） -->
  <fieldset>
    <legend>ラベル間の余白（mm）</legend>
    <div class="grid">
      <label>横 <input type="number" id="gapX" value="5" min="0" step="0.01"></label>
      <label>縦 <input type="number" id="gapY" value="5" min="0" step="0.01"></label>
    </div>
  </fieldset>

  <!-- 文字の見た目に関する設定 -->
  <fieldset>
    <legend>文字と枠線</legend>
    <div class="rows">
      <label>内側の余白（mm） <input type="number" id="padding" value="2" min="0" step="0.01"></label>
      <label>文字サイズ（pt） <input type="number" id="fontSize" value="12" min="4" step="0.1"></label>
      <label><input type="checkbox" id="showBorder"> 枠線を印字する</label>
    </div>
  </fieldset>

  <!-- フォントを読み込み終わるまでは押せない -->
  <button type="button" id="createButton" disabled>PDFを作成</button>
  <p id="status" role="status"></p>

      {

        marginTop: 8.8, marginBottom: 8.8, marginLeft: 8.4, marginRight: 8.4,
        labelWidth: 48.3, labelHeight: 25.4, gapX: 0, gapY: 0,
      },
      // 出典: https://www.hisago.co.jp/products/elm023/
      {
        id: 'hisago-elm023', name: 'ヒサゴ ELM023 A4 65面 38.1×21.2mm',
        marginTop: 10.92, marginBottom: 10.48, marginLeft: 4.75, marginRight: 4.75,
        labelWidth: 38.1, labelHeight: 21.2, gapX: 2.5, gapY: 0,
      },
    ];

    const presetFilter = document.getElementById('presetFilter');
    const presetSelect = document.getElementById('preset');
    const presetCount = document.getElementById('presetCount');
    const createButton = document.getElementById('createButton');
    const statusText = document.getElementById('status');

    // 読み込んだフォントの Base64 文字列（PDF を作るたびに使い回す）
    let fontBase64 = null;

    // ===== 画面表示 =====

    // ボタン下のお知らせを表示する（type: 'info' / 'error' / 'warning'）
    function showStatus(message, type = 'info') {
      statusText.textContent = message;
      statusText.className = type;
    }

    // ===== 用紙プリセット =====

    // いま選ばれているプリセットの id。絞り込みで選択肢から一時的に消えても覚えておく
    let selectedPresetId = CUSTOM_PRESET_ID;

    // 比べやすい形にそろえる（全角英数字→半角、大文字→小文字、「×」→「x」）
    function normalizeForSearch(text) {
      return text.normalize('NFKC').toLowerCase().replace(/×/g, 'x');
    }

    // 絞り込み欄の文字を含むプリセットだけで、ドロップダウンの選択肢を作り直す
    // 空白で区切って複数の語を入れたときは、すべての語を含むものだけを残す
    function renderPresetOptions() {
      const words = normalizeForSearch(presetFilter.value).split(/\s+/).filter((word) => word !== '');
      const matched = PRESETS.filter((preset) => {
        const name = normalizeForSearch(preset.name);
        return words.every((word) => name.includes(word));
      });

      // 「カスタム」は絞り込みに関係なく、常に先頭に置く
      presetSelect.replaceChildren(new Option('カスタム（手動設定）', CUSTOM_PRESET_ID));
      for (const preset of matched) {
        presetSelect.add(new Option(preset.name, preset.id));
      }

      // 選んでいたプリセットが残っていればそれを選ぶ。消えた場合は「カスタム」を表示する
      const stillShown = matched.some((preset) => preset.id === selectedPresetId);
      presetSelect.value = stillShown ? selectedPresetId : CUSTOM_PRESET_ID;

      presetCount.textContent = words.length > 0
        ? `${PRESETS.length}件中 ${matched.length}件が見つかりました`
        : `${PRESETS.length}件`;
    }

    // プリセットを選んだら、寸法の欄に値を入れる（カスタムのときは今の値をそのまま残す）
    function applyPreset() {
      selectedPresetId = presetSelect.value;
      const preset = PRESETS.find((item) => item.id === selectedPresetId);
      if (!preset) {
        return;
      }
      for (const id of PRESET_FIELDS) {
        document.getElementById(id).value = preset[id];
      }
    }

    // 寸法の欄を手で変えて、選んでいるプリセットと値が違ったら「カスタム」に切り替える
    function syncPresetWithInputs() {
      const preset = PRESETS.find((item) => item.id === selectedPresetId);
      if (!preset) {
        return;
      }
      const matches = PRESET_FIELDS.every(
        (id) => Number(document.getElementById(id).value) === preset[id]
      );
      if (!matches) {
        selectedPresetId = CUSTOM_PRESET_ID;
        presetSelect.value = CUSTOM_PRESET_ID;
      }
    }

    // ===== フォントの読み込み =====

    // バイナリデータを Base64 文字列に変換する
    function arrayBufferToBase64(buffer) {
      const bytes = new Uint8Array(buffer);
      // 一度に大量の引数を渡すとエラーになるため、区切って文字列にする
      const chunkSize = 0x8000;
      let binary = '';
      for (let i = 0; i < bytes.length; i += chunkSize) {
        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
      }
      return btoa(binary);
    }

    // ページを開いた時点でフォントを読み込み、終わったらボタンを押せるようにする
    async function loadFont() {
      showStatus('フォント読み込み中…');
      try {
        if (!window.jspdf) {
          throw new Error('jsPDF を読み込めませんでした');
        }
        const response = await fetch(FONT_URL);
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }
        fontBase64 = arrayBufferToBase64(await response.arrayBuffer());
        createButton.disabled = false;
        showStatus('');
      } catch (error) {
        console.error(error);
        showStatus('読み込みに失敗しました。インターネット接続を確認して、ページを再読み込みしてください。', 'error');
      }
    }

    // ===== 入力値の読み取りとチェック =====

    // 入力欄の値を読み取る。問題があれば errors にメッセージを入れて返す
    function readSettings() {
      const errors = [];

      // 数値の欄を読み取る（空欄・数値以外・マイナスはエラー）
      function readNumber(id, name) {
        const raw = document.getElementById(id).value.trim();
        const value = Number(raw);
        if (raw === '' || !Number.isFinite(value) || value < 0) {
          errors.push(`「${name}」には 0 以上の数値を入力してください`);
          return NaN;
        }
        return value;
      }

      const settings = {
        text: document.getElementById('text').value,
        marginTop: readNumber('marginTop', '余白（上）'),
        marginBottom: readNumber('marginBottom', '余白（下）'),
        marginLeft: readNumber('marginLeft', '余白（左）'),
        marginRight: readNumber('marginRight', '余白（右）'),
        labelWidth: readNumber('labelWidth', 'ラベルの幅'),
        labelHeight: readNumber('labelHeight', 'ラベルの高さ'),
        gapX: readNumber('gapX', 'ラベル間の余白（横）'),
        gapY: readNumber('gapY', 'ラベル間の余白（縦）'),
        padding: readNumber('padding', '内側の余白'),
        fontSize: readNumber('fontSize', '文字サイズ'),
        showBorder: document.getElementById('showBorder').checked,
      };

      // 数値として読めた欄についてだけ、追加のチェックをする
      if (settings.labelWidth === 0 || settings.labelHeight === 0) {
        errors.push('ラベルの幅と高さには 0 より大きい値を入力してください');
      }
      if (settings.fontSize >= 0 && settings.fontSize < MIN_FONT_SIZE) {
        errors.push(`文字サイズは ${MIN_FONT_SIZE}pt 以上にしてください`);
      }
      if (settings.padding * 2 >= settings.labelWidth || settings.padding * 2 >= settings.labelHeight) {
        errors.push('内側の余白が大きすぎて、文字を置く場所がありません');
      }
      if (settings.text.trim() === '') {
        errors.push('テキストを入力してください');
      }

      return { settings, errors };
    }

    // ===== 寸法の計算（プレビューと PDF で共通に使う） =====

    // 列数・行数と、各ラベルの左上の位置（mm）を計算する
    function calculateLayout(settings) {
      const usableWidth = PAPER_WIDTH - settings.marginLeft - settings.marginRight;
      const usableHeight = PAPER_HEIGHT - settings.marginTop - settings.marginBottom;

      // 市販品の寸法の丸め（例: 合計が 297.01mm になる製品）で 1 行少なくならないよう、
      // 使える範囲を 0.05mm だけ広く見てから切り捨てる
      const tolerance = 0.05;
      const cols = Math.max(0, Math.floor((usableWidth + settings.gapX + tolerance) / (settings.labelWidth + settings.gapX)));
      const rows = Math.max(0, Math.floor((usableHeight + settings.gapY + tolerance) / (settings.labelHeight + settings.gapY)));

      const positions = [];
      for (let row = 0; row < rows; row++) {
        for (let col = 0; col < cols; col++) {
          positions.push({
            x: settings.marginLeft + col * (settings.labelWidth + settings.gapX),
            y: settings.marginTop + row * (settings.labelHeight + settings.gapY),
          });
        }
      }

      return { cols, rows, positions };
    }

    // ===== PDF の作成 =====

    // テキストがラベルの内側に収まる文字サイズ（pt）を求める
    // 戻り値の fits が false のときは、下限の文字サイズでも収まらない
    function fitFontSize(doc, lines, areaWidth, areaHeight, maxFontSize) {
      // 上限の文字サイズで、一番長い行の幅（mm）を測る
      doc.setFontSize(maxFontSize);
      const widestLine = Math.max(...lines.map((line) => doc.getTextWidth(line)));

      // 文字の幅と高さは文字サイズに比例するので、比率で収まるサイズを計算する
      const sizeByWidth = widestLine > 0 ? maxFontSize * areaWidth / widestLine : maxFontSize;
      const sizeByHeight = areaHeight / (lines.length * LINE_HEIGHT_RATIO * PT_TO_MM);
      const size = Math.min(maxFontSize, sizeByWidth, sizeByHeight);

      if (size < MIN_FONT_SIZE) {
        return { size: MIN_FONT_SIZE, fits: false };
      }
      return { size, fits: true };
    }

    // 入力内容から PDF を作り、labels.pdf として保存する
    function createPdf() {
      const { settings, errors } = readSettings();
      if (errors.length > 0) {
        showStatus(errors.join('\n'), 'error');
        return;
      }

      const layout = calculateLayout(settings);
      if (layout.positions.length === 0) {
        showStatus('ラベルが用紙に収まりません', 'error');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });

      // 日本語フォントを登録して使う（登録は PDF ごとに必要）
      doc.addFileToVFS(FONT_FILE_NAME, fontBase64);
      doc.addFont(FONT_FILE_NAME, FONT_NAME, 'normal');
      doc.setFont(FONT_NAME, 'normal');

      // 改行で行に分ける。末尾の余分な改行は、中央揃えがずれないように取り除く
      const lines = settings.text.replace(/(\r?\n)+$/, '').split(/\r?\n/);

      // 全ラベルが同じ内容なので、文字サイズは 1 回だけ計算する
      const areaWidth = settings.labelWidth - settings.padding * 2;
      const areaHeight = settings.labelHeight - settings.padding * 2;
      const fit = fitFontSize(doc, lines, areaWidth, areaHeight, settings.fontSize);
      doc.setFontSize(fit.size);
      const lineHeight = fit.size * LINE_HEIGHT_RATIO * PT_TO_MM;

      // 枠線は細い灰色の線にする
      doc.setDrawColor(160);
      doc.setLineWidth(0.1);

      for (const { x, y } of layout.positions) {
        if (settings.showBorder) {
          doc.rect(x, y, settings.labelWidth, settings.labelHeight);
        }

        // ラベルの中心を基準に、複数行をまとめて上下左右の中央にそろえる
        const centerX = x + settings.labelWidth / 2;
        const centerY = y + settings.labelHeight / 2;
        lines.forEach((line, index) => {
          if (line === '') {
            return;
          }
          const lineY = centerY + (index - (lines.length - 1) / 2) * lineHeight;
          doc.text(line, centerX, lineY, { align: 'center', baseline: 'middle' });
        });
      }

      doc.save('labels.pdf');

      const summary = `${layout.cols}列 × ${layout.rows}行 = ${layout.positions.length}枚のラベルで PDF を作成しました`;
      if (fit.fits) {
        showStatus(summary);
      } else {
        showStatus(`${summary}。テキストが長すぎて、文字サイズ ${MIN_FONT_SIZE}pt でもラベルに収まりません`, 'warning');
      }
    }

    presetFilter.addEventListener('input', renderPresetOptions);
    presetSelect.addEventListener('change', applyPreset);
    // プリセットで変わる欄だけを見張る
    for (const id of PRESET_FIELDS) {
      document.getElementById(id).addEventListener('input', syncPresetWithInputs);
    }
    renderPresetOptions();
    createButton.addEventListener('click', createPdf);
    loadFont();
  </script>
